<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universal DataSet</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f5f5f5;
    }

    .data-set {
      width: 100%;
      max-width: 1200px;
      margin: 20px auto;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      border-radius: 8px;
      overflow: hidden;
    }

    .header-row {
      display: flex;
      background-color: #3498db;
      color: white;
      font-weight: bold;
    }

    .header-cell {
      padding: 12px 16px;
      text-align: left;
      flex: 1;
      border-right: 1px solid rgba(255, 255, 255, 0.3);
    }

    .body {
      display: flex;
      flex-direction: column;
    }

    .row {
      display: flex;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .row.selected {
      background-color: #e0e0ff;
    }

    .select-area {
      width: 50px; /* Фиксированная ширина */
      height: 100%;
      background-color: #ddd;
      border-right: 1px solid #ccc;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .cell {
      padding: 12px 16px;
      border-right: 1px solid #e0e0e0;
      text-align: left;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .cell:last-child {
      border-right: none;
    }

    h1 {
      text-align: center;
      margin-top: 20px;
      color: #3498db;
    }
  </style>
</head>
<body>
  <div id="root"></div>
</body>
</html>
